# Second held-out set, written after the third report (TCS 2025-26) was added
# and before the system was run on it. Like the first, it is never used to
# decide what to change: add questions instead of fixing against these.
#
# It covers single facts from the TCS report, single facts from the Infosys
# 2024-25 report on pages no other set uses, comparisons of the two companies,
# and questions the reports cannot answer. For comparisons, `page` is in the
# Infosys report and `other_page` in the TCS report. All pages are PDF page
# positions.

questions:
  # --- TCS 2025-26, single facts -------------------------------------------
  - id: h2-tcs-final-dividend
    category: tcs
    question: What final dividend per share did TCS recommend for fiscal 2026, in ₹?
    type: number
    accepted: ["31"]
    page: 36
  - id: h2-tcs-special-dividend
    category: tcs
    question: What special dividend per share did TCS pay for fiscal 2026, in ₹?
    type: number
    accepted: ["46"]
    page: 36
  - id: h2-tcs-restructuring
    category: tcs
    question: What exceptional item for re-structuring expenses did TCS record in its consolidated results for fiscal 2026, in ₹ crore?
    type: number
    accepted: ["1,388"]
    page: 167
  - id: h2-tcs-labour-codes
    category: tcs
    question: What was the statutory impact of the new Labour Codes in TCS's consolidated results for fiscal 2026, in ₹ crore?
    type: number
    accepted: ["2,128"]
    page: 167
  - id: h2-tcs-legal-claim
    category: tcs
    question: What provision towards a legal claim did TCS record as an exceptional item in fiscal 2026, in ₹ crore?
    type: number
    accepted: ["1,010"]
    page: 167
  - id: h2-tcs-agm
    category: tcs
    question: On what date is TCS's Annual General Meeting for fiscal 2026?
    type: text
    accepted: ["June 9, 2026", "9 June 2026", "9th June 2026", "June 9th, 2026"]
    page: 93
  - id: h2-tcs-permanent-employees
    category: tcs
    question: How many permanent employees did TCS have at the end of fiscal 2026?
    type: number
    accepted: ["5,84,519"]
    page: 108

  # --- Infosys 2024-25, single facts ---------------------------------------
  - id: h2-infy25-sundaram
    category: infosys_2025
    question: What commission was paid to D. Sundaram by Infosys for fiscal 2025, in ₹ crore?
    type: number
    accepted: ["2.86"]
    page: 107
  - id: h2-infy25-impact-assessment
    category: infosys_2025
    question: How much did Infosys spend on CSR impact assessment in fiscal 2025, in ₹ crore?
    type: number
    accepted: ["0.84"]
    page: 63
  - id: h2-infy25-fresh-graduates
    category: infosys_2025
    question: How many fresh graduates did Infosys hire globally in fiscal 2025?
    type: number
    accepted: ["15,288"]
    page: 22

  # --- Infosys versus TCS, fiscal 2026 ---------------------------------------
  - id: h2-xc-goodwill
    category: cross_company
    question: What was consolidated goodwill as at March 31, 2026 for Infosys and for TCS, in ₹ crore?
    type: number
    accepted: ["12,117 and 9,108"]
    page: 285
    other_page: 166
  - id: h2-xc-operating-cash
    category: cross_company
    question: What was consolidated net cash generated by operating activities in fiscal 2026 for Infosys and for TCS, in ₹ crore?
    type: number
    accepted: ["33,986 and 52,094"]
    page: 294
    other_page: 172
  - id: h2-xc-cash
    category: cross_company
    question: What were consolidated cash and cash equivalents as at March 31, 2026 for Infosys and for TCS, in ₹ crore?
    type: number
    accepted: ["22,201 and 6,417"]
    page: 285
    other_page: 166

  # --- Not in the reports ------------------------------------------------------
  - id: h2-na-wipro-dividend
    category: unanswerable
    question: What was Wipro's total dividend per share for fiscal 2026?
    answerable: false
  - id: h2-na-tcs-forecast
    category: unanswerable
    question: What revenue does TCS expect to report for fiscal 2028?
    answerable: false
