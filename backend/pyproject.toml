[project]
name = "annual-report-analyst"
version = "0.1.0"
description = "Agentic RAG over Indian company annual reports with cited, number-verified answers."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "fastembed>=0.8.1",
    "langchain-core>=1.6.6",
    "langchain-text-splitters>=1.1.3",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.36",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx2>=1.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
