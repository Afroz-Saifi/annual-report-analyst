# Annual reports to ingest. Download each PDF by hand from the company's
# investor page into data/raw/ (company sites block scripted downloads), then
# list it here and run `uv run python -m app.cli ingest` from backend/.
#
# - company: Example Ltd
#   ticker: EXAMPLE
#   fiscal_year: 2025          # the year the financial year ends
#   source_url: https://example.com/annual-report-2025.pdf
#   file: example-ar-2025.pdf  # file name inside data/raw/
reports:
  - company: Infosys
    ticker: INFY
    fiscal_year: 2026
    source_url: https://www.infosys.com/investors/reports-filings/annual-report/annual/documents/infosys-ar-26.pdf
    file: infosys-ar-26.pdf
  - company: Infosys
    ticker: INFY
    fiscal_year: 2025
    source_url: https://www.infosys.com/investors/reports-filings/annual-report/annual/documents/infosys-ar-25.pdf
    file: infosys-ar-25.pdf
  - company: Tata Consultancy Services
    ticker: TCS
    fiscal_year: 2026
    source_url: https://www.tcs.com/content/dam/tcs/investor-relations/financial-statements/2025-26/ar/annual-report-2025-2026.pdf
    file: tcs-ar-26.pdf
    # TCS's fonts draw ₹ as H in figures and as J in some unit labels.
    rupee_glyphs: [H, J]
